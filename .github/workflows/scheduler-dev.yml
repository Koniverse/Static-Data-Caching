name: Scheduler Dev
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - dev
  workflow_dispatch:
    branches:
      - dev
    inputs:
      note:
        description: 'Note'
        required: false
        default: ''

concurrency: 'dev'

jobs:
  master:
    if: "!startsWith(github.event.head_commit.message, '[CI Skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Earning Scheduler Dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}

      - name: Update data
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_CONSOLE: true
          BITTENSOR_API_KEY: ${{ secrets.BITTENSOR_API_KEY }}
        run: |
          yarn install
          NODE_ENV=development yarn fetch-data

      # cloudflare/pages-action no longer exists (404 on 2026-10-20), which failed every run since 2026-09-18
      - name: Deploy to Cloudflare Pages
        id: cloudflare_deployment
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GH_AUTOMATION_TOKEN }}
          wranglerVersion: '3'
          command: pages deploy ./data --project-name=sw-static-cache --branch=dev

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Scheduler
          author_email: scheduler@github.io
          message: '[CI Skip] Update earning data (dev)'
